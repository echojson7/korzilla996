<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Korzilla 996</title>
  <meta name="color-scheme" content="light dark">
  <script>
    /* Тема и фон до первого кадра, иначе мигнёт. Правила — копия apply()
       из src/lib/look.ts (ключи k996.theme и k996.bg). */
    try {
      var root = document.documentElement;
      var get = function (key) { try { return JSON.parse(localStorage.getItem("k996." + key)); } catch (e) { return null; } };
      var theme = get("theme") || "system";
      var dark = theme === "dark" || (theme === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
      root.classList.toggle("dark", dark);
      root.dataset.theme = dark ? "dark" : "light";
      var colors = { synthwave: "rgb(110 39 101)", dusk: "rgb(116 69 114)", aurora: "rgb(15 44 65)", waves: "rgb(148 164 159)", dunes: "rgb(221 140 132)", nightforest: "rgb(37 51 97)", candy: "rgb(210 152 192)", lagoon: "rgb(75 182 210)" };
      var bg = get("bg");
      if (!colors[bg]) bg = "dusk";
      var size = Math.max(screen.width, screen.height) * devicePixelRatio > 1600 ? "" : "-1280";
      root.style.setProperty("--bg-color", colors[bg]);
      root.style.setProperty("--bg-image", 'url("' + new URL("./bg/" + bg + size + ".webp", location.href).href + '")');
    } catch (e) {}
  </script>
